<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Try it on</title>
<style>
  :root { --bg:#0b0b0c; --fg:#f4f4f5; --muted:#a1a1aa; --accent:#6d5efc; --line:#27272a; --ok:#22c55e; --bad:#f87171; }
  @media (prefers-color-scheme: light){ :root{ --bg:#fff; --fg:#111; --muted:#52525b; --line:#e4e4e7; --ok:#15803d; --bad:#b91c1c; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  .stage{position:relative}
  video,img{width:100%;border-radius:14px;background:#222;display:block}
  #out{position:absolute;inset:0;height:100%;object-fit:cover}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0;}
  input[type=text],input[type=password],select{background:transparent;color:var(--fg);border:1px solid var(--line);
       border-radius:10px;padding:10px 12px;font-size:15px;min-width:0;flex:1}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;}
  button:disabled{opacity:.45;cursor:default}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  label.consent{display:flex;gap:8px;align-items:flex-start;font-size:14px;opacity:.9;margin:12px 0;}
  .hint{color:var(--muted);font-size:14px;}
  #status[data-tone=ok]{color:var(--ok)} #status[data-tone=error]{color:var(--bad)}
  #timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
</style>
</head>
<body>
  <div class="wrap">
    <h1 id="brand">Try it on</h1>
    <p class="hint">Stand so your upper body is visible, arms relaxed.</p>
    <div class="stage">
      <video id="cam" autoplay playsinline muted></video>
      <video id="out" autoplay playsinline muted hidden></video>
    </div>
    <div class="row">
      <input type="file" id="garment" accept="image/*"/>
      <select id="category" aria-label="Garment type">
        <option value="tops">Top</option>
        <option value="bottoms">Bottom</option>
        <option value="one-pieces">Dress / one-piece</option>
      </select>
    </div>
    <div class="row">
      <input type="text" id="desc" placeholder="Describe it (optional), e.g. navy linen shirt" maxlength="200"/>
    </div>
    <div class="row" id="code-row" hidden>
      <input type="password" id="code" placeholder="Access code" autocomplete="off"/>
    </div>
    <div class="row">
      <button id="photoBtn">Photo try-on</button>
      <button id="liveBtn">Live try-on</button>
      <button id="stopBtn" class="ghost" disabled>Stop</button>
      <span id="timer"></span>
    </div>
    <label class="consent" id="consent-row">
      <input type="checkbox" id="consent"/>
      <span>Optional: allow using my try-on video to improve the service. I am 18+.
        Try-on works either way.</span>
    </label>
    <img id="result" alt="Try-on result" hidden/>
    <p class="hint" id="status" role="status"></p>
  </div>
<script type="module" src="/app.js?v=5f3391840f62"></script>
</body>
</html>
